<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Heart For Her</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #010001; /* უფრო მუქი ფონი */
            overflow: hidden;
            font-family: 'Times New Roman', Times, serif;
        }

        #webgl {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .title-container {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 10;
            pointer-events: none;
            width: 100%;
        }

        .title-container h1 {
            font-style: italic;
            font-weight: 400;
            font-size: 3rem;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.6);
        }

        .sub-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffb6c1;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: Arial, sans-serif;
            text-shadow: 0 0 10px rgba(255, 20, 147, 1);
            z-index: 10;
            pointer-events: none;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="title-container">
        <h1>Love Heart For Her</h1>
    </div>
    <div class="sub-text">this is for you</div>
    
    <canvas id="webgl"></canvas>

    <!-- Three.js ძირითადი ბიბლიოთეკა -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        const canvas = document.querySelector('#webgl');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2('#010001', 0.05);

        const sizes = {
            width: window.innerWidth,
            height: window.innerHeight
        };

        const camera = new THREE.PerspectiveCamera(45, sizes.width / sizes.height, 0.1, 100);
        camera.position.z = 10;
        scene.add(camera);

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            alpha: true
        });
        renderer.setSize(sizes.width, sizes.height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;

        // 1. გარე ნაწილაკების სისტემა
        const count = 3800;
        const particleGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);

        const colorChoices = [
            new THREE.Color('#ff0055'),
            new THREE.Color('#ff69b4'),
            new THREE.Color('#ffb6c1'),
            new THREE.Color('#ffffff')
        ];

        for (let i = 0; i < count; i++) {
            const i3 = i * 3;
            const t = Math.random() * Math.PI * 2;
            const rX = 16 * Math.pow(Math.sin(t), 3);
            const rY = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            const rZ = (Math.random() - 0.5) * 5;

            positions[i3 + 0] = rX * 0.35 + (Math.random() - 0.5) * 0.6;
            positions[i3 + 1] = rY * 0.35 + (Math.random() - 0.5) * 0.6;
            positions[i3 + 2] = rZ;
            
            const colorIndex = Math.floor(Math.random() * colorChoices.length);
            const chosenColor = colorChoices[colorIndex];
            
            colors[i3 + 0] = chosenColor.r;
            colors[i3 + 1] = chosenColor.g;
            colors[i3 + 2] = chosenColor.b;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.09,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // 2. განათება (კრისტალური ბზინვარებისთვის)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0xff1493, 15);
        spotLight.position.set(0, 8, 8);
        spotLight.angle = Math.PI / 4;
        spotLight.penumbra = 0.8;
        scene.add(spotLight);

        const pointLight = new THREE.PointLight(0xff00ff, 8, 25);
        pointLight.position.set(-4, -4, 4);
        scene.add(pointLight);

        // დამატებითი უკანა განათება შუშის ეფექტის გამოსაკვეთად
        const backLight = new THREE.DirectionalLight(0xffb6c1, 4);
        backLight.position.set(0, 0, -5);
        scene.add(backLight);

        // 3. იდეალური მინისებრი 3D გულის შექმნა (კოდით)
        const heartShape = new THREE.Shape();
        heartShape.moveTo(0, 0.7);
        heartShape.bezierCurveTo(0, 0.7, 0.35, 1.4, 1.3, 1.4);
        heartShape.bezierCurveTo(2.3, 1.4, 2.5, 0.5, 2.5, 0.4);
        heartShape.bezierCurveTo(2.5, -0.4, 1.5, -1.3, 0, -2.2);
        heartShape.bezierCurveTo(-1.5, -1.3, -2.5, -0.4, -2.5, 0.4);
        heartShape.bezierCurveTo(-2.5, 0.5, -2.3, 1.4, -1.3, 1.4);
        heartShape.bezierCurveTo(-0.4, 1.4, 0, 0.7, 0, 0.7);

        const extrudeSettings = {
            depth: 0.4,
            bevelEnabled: true,
            bevelSegments: 16, // ძალიან გლუვი კუთხეებისთვის
            steps: 2,
            bevelSize: 0.35,
            bevelThickness: 0.35
        };

        const heartGeometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
        heartGeometry.center();

        // ულამაზესი გამჭვირვალე კრისტალის მასალა
        const heartMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xff3b75, // ნაზი ვარდისფერი-ჟოლოსფერი ტონი
            metalness: 0.05,
            roughness: 0.02, // თითქმის სარკისებრი სიგლუვე
            transmission: 0.92, // მაღალი გამჭვირვალობა/შუშის ეფექტი
            ior: 1.6, // სინათლის გარდატეხა (კრისტალის ინდექსი)
            thickness: 1.8, // შუშის შიდა მოცულობის სისქე
            transparent: true,
            opacity: 0.95,
            clearcoat: 1.0, // პრიალა ლაქის ფენა ზედაპირზე
            clearcoatRoughness: 0.02,
            side: THREE.DoubleSide
        });

        const heartMesh = new THREE.Mesh(heartGeometry, heartMaterial);
        heartMesh.scale.set(0.55, 0.55, 0.55); // ვიდეოსნაირი პატარა და ლამაზი ზომა
        heartMesh.position.y = -0.6; // ტექსტის ქვეშ ზუსტად განლაგება
        scene.add(heartMesh);

        // მაუსის მოძრაობა
        let mouseX = 0;
        let mouseY = 0;
        window.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / sizes.width) - 0.5;
            mouseY = -(event.clientY / sizes.height) + 0.5;
        });

        window.addEventListener('resize', () => {
            sizes.width = window.innerWidth;
            sizes.height = window.innerHeight;
            
            camera.aspect = sizes.width / sizes.height;
            camera.updateProjectionMatrix();
            
            renderer.setSize(sizes.width, sizes.height);
        });

        // 4. ანიმაცია
        const clock = new THREE.Clock();

        const tick = () => {
            const elapsedTime = clock.getElapsedTime();
            
            // ნაწილაკების ნაზი ტრიალი
            particles.rotation.y = elapsedTime * 0.15;
            particles.rotation.z = Math.sin(elapsedTime * 0.1) * 0.05;

            // შუშის გულის ბრუნვა და ნაზი პულსაცია
            if (heartMesh) {
                heartMesh.rotation.y = elapsedTime * 1.1; // ლამაზი, ზომიერი ტრიალი
                heartMesh.rotation.x = Math.sin(elapsedTime * 0.5) * 0.1;
                
                // ჰარმონიული, ნაზი ფეთქვის ეფექტი
                const pulse = 0.55 + Math.sin(elapsedTime * 2.8) * 0.015;
                heartMesh.scale.set(pulse, pulse, pulse);
            }

            // კამერის ინტერაქცია მაუსის მოძრაობაზე
            camera.position.x += (mouseX * 4 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 4 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            
            renderer.render(scene, camera);
            
            window.requestAnimationFrame(tick);
        };

        tick();
    </script>
</body>
</html>
