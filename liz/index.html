<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For You ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05020a;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ცენტრალური ტექსტი გულში */
    .message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      color: #ffffff;
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 40px #ff0077;
      animation: pulseText 2s infinite ease-in-out;
    }

    @keyframes pulseText {
      0%, 100% { transform: translate(-50%, -50%) scale(0.98); opacity: 0.8; }
      50% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- შეგიძლია აქ შეცვალო ტექსტი (მაგალითად ჩაუწერო სახელი) -->
  <div class="message">I Love You ❤️</div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    let touchParticles = [];
    let time = 0;

    // ეკრანის მორგება
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // გულის მათემატიკური ფორმულა
    function getHeartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    // გულის ნაწილაკების შექმნა
    const isMobile = window.innerWidth < 600;
    const particleCount = isMobile ? 1200 : 2200;

    for (let i = 0; i < particleCount; i++) {
      const step = Math.random() * Math.PI * 2;
      const point = getHeartPoint(step);
      
      // სიღრმის (3D) ეფექტისთვის
      const depth = (Math.random() - 0.5) * 30;
      
      particles.push({
        baseX: point.x,
        baseY: point.y,
        x: 0,
        y: 0,
        z: depth,
        size: Math.random() * 2 + 0.5,
        // ვარდისფერი, წითელი და ოქროსფერი ტონალობები
        color: Math.random() > 0.2 
          ? `hsl(${330 + Math.random() * 30}, 100%, ${60 + Math.random() * 20}%)`
          : `hsl(${40 + Math.random() * 20}, 100%, ${70 + Math.random() * 20}%)`,
        alpha: Math.random() * 0.8 + 0.2,
        speed: Math.random() * 0.02 + 0.005
      });
    }

    // თითის/მაუსის მიყოლის ეფექტი (Sparkles)
    function addSparkles(x, y) {
      for (let i = 0; i < 5; i++) {
        touchParticles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          size: Math.random() * 3 + 1,
          color: `hsl(${330 + Math.random() * 40}, 100%, 75%)`,
          life: 1
        });
      }
    }

    window.addEventListener('mousemove', (e) => addSparkles(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        addSparkles(e.touches[0].clientX, e.touches[0].clientY);
      }
    });

    // მთავარი ანიმაციის ციკლი
    function animate() {
      time += 0.02;
      
      // ფონის ნელი წაშლა მბზინავი კვალისთვის
      ctx.fillStyle = 'rgba(5, 2, 10, 0.2)';
      ctx.fillRect(0, 0, width, height);

      const centerX = width / 2;
      const centerY = height / 2;
      
      // გულის ზომის ავტომატური სკალირება
      const baseScale = Math.min(width, height) / (isMobile ? 38 : 30);
      const pulse = 1 + Math.sin(time * 3) * 0.08; // გულისცემის ეფექტი

      // 1. გულის ნაწილაკების დახატვა
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];

        // 3D ბრუნვა და პულსაცია
        const scale = baseScale * pulse;
        const targetX = centerX + p.baseX * scale + Math.sin(time + p.z) * 5;
        const targetY = centerY + p.baseY * scale + Math.cos(time + p.z) * 5;

        p.x += (targetX - p.x) * 0.1;
        p.y += (targetY - p.y) * 0.1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (pulse > 1 ? 1.2 : 1), 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
        ctx.fill();
      }

      // 2. თითის/მაუსის ნაპერწკლების დახატვა
      for (let i = touchParticles.length - 1; i >= 0; i--) {
        const tp = touchParticles[i];
        tp.x += tp.vx;
        tp.y += tp.vy;
        tp.life -= 0.02;

        if (tp.life <= 0) {
          touchParticles.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        ctx.arc(tp.x, tp.y, tp.size, 0, Math.PI * 2);
        ctx.fillStyle = tp.color;
        ctx.globalAlpha = tp.life;
        ctx.shadowBlur = 8;
        ctx.shadowColor = tp.color;
        ctx.fill();
      }

      ctx.shadowBlur = 0; // რესეტი
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
