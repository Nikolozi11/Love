<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For You ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1a0314 0%, #030006 100%);
      font-family: 'Poppins', sans-serif;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ტექსტი ცენტრში */
    .text-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      width: 85%;
      max-width: 450px;
      pointer-events: none;
      opacity: 0;
      transition: all 2.5s ease;
    }

    .text-overlay.show {
      opacity: 1;
    }

    .text-overlay h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(18px, 4.8vw, 28px);
      line-height: 1.4;
      color: #ffffff;
      letter-spacing: 1px;
      text-shadow: 0 0 15px #ff69b4, 0 0 30px #ff1493;
      margin-bottom: 8px;
    }

    .text-overlay p {
      font-size: clamp(10px, 2.8vw, 13px);
      color: #ffd700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #ffd700;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="text-overlay" id="textOverlay">
    <h1>With you, every moment feels like magic</h1>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let flowers = [];
    let butterflies = [];
    let time = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initFlowers(); // ეკრანის ზომის შეცვლისას ადაპტაცია
    }
    window.addEventListener('resize', resize);

    // გულის მათემატიკური ფორმულა
    function getHeartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    // 1. ყვავილების შექმნა (კომპიუტერზე დიდი, მობილურზე ნაზი)
    function initFlowers() {
      flowers = [];
      const isMobile = window.innerWidth < 600;
      const flowerCount = isMobile ? 100 : 110;
      
      for (let i = 0; i < flowerCount; i++) {
        const t = (i / flowerCount) * Math.PI * 2;
        const pt = getHeartPoint(t);
        flowers.push({
          targetX: pt.x,
          targetY: pt.y,
          size: 0,
          // კომპიუტერზე ძველი ზომა (Math.random()*8 + 6), მობილურზე შემცირებული
          maxSize: isMobile ? (Math.random() * 3 + 2.5) : (Math.random() * 8 + 6),
          petals: isMobile ? 5 : (Math.floor(Math.random() * 3) + 5),
          color: Math.random() > 0.3 ? `hsl(${330 + Math.random() * 30}, 100%, 75%)` : '#ffd700',
          delay: i * 22
        });
      }
    }

    resize();

    // 2. პეპლების შექმნა
    function createButterfly(x, y) {
      const isMobile = window.innerWidth < 600;
      butterflies.push({
        x: x || Math.random() * width,
        y: y || Math.random() * height,
        size: isMobile ? (Math.random() * 4 + 5) : (Math.random() * 8 + 8),
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5,
        wingAngle: 0,
        color: '#ffb6c1'
      });
    }

    for (let i = 0; i < 6; i++) createButterfly();

    const handleTouch = (e) => {
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      createButterfly(x, y);
    };

    window.addEventListener('pointerdown', handleTouch);

    setTimeout(() => {
      document.getElementById('textOverlay').classList.add('show');
    }, 2200);

    // 3. ყვავილის დახატვა
    function drawFlower(x, y, size, petals, color) {
      if (size <= 0) return;
      ctx.save();
      ctx.translate(x, y);

      const isMobile = window.innerWidth < 600;
      // კომპიუტერზე სქელი ფურცლები (size/2), მობილურზე ნაზი (size/3)
      const petalWidth = isMobile ? (size / 3) : (size / 2);

      for (let i = 0; i < petals; i++) {
        ctx.rotate((Math.PI * 2) / petals);
        ctx.beginPath();
        ctx.ellipse(0, size, petalWidth, size, 0, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.shadowBlur = isMobile ? 6 : 10;
        ctx.shadowColor = color;
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(0, 0, size / 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();

      ctx.restore();
    }

    // 4. მთავარი ანიმაცია
    function animate() {
      time += 0.02;

      ctx.fillStyle = 'rgba(3, 0, 6, 0.2)';
      ctx.fillRect(0, 0, width, height);

      const centerX = width / 2;
      const centerY = height / 2;
      
      const isMobile = width < 600;
      const scale = Math.min(width, height) / (isMobile ? 36 : 28);

      flowers.forEach((f, index) => {
        const x = centerX + f.targetX * scale;
        const y = centerY + f.targetY * scale;

        if (time * 1000 > f.delay) {
          if (f.size < f.maxSize) f.size += 0.2;
        }

        const floatY = y + Math.sin(time * 2 + index) * 1.8;
        drawFlower(x, floatY, f.size, f.petals, f.color);
      });

      butterflies.forEach((b) => {
        b.x += b.vx + Math.sin(time * 3) * 0.8;
        b.y += b.vy + Math.cos(time * 3) * 0.8;
        b.wingAngle += 0.15;

        if (b.x < 0 || b.x > width) b.vx *= -1;
        if (b.y < 0 || b.y > height) b.vy *= -1;

        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.scale(Math.sin(b.wingAngle), 1);

        ctx.beginPath();
        ctx.ellipse(-b.size / 2, 0, b.size, b.size / 2, Math.PI / 4, 0, Math.PI * 2);
        ctx.ellipse(b.size / 2, 0, b.size, b.size / 2, -Math.PI / 4, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.shadowBlur = isMobile ? 8 : 12;
        ctx.shadowColor = '#ff69b4';
        ctx.fill();

        ctx.restore();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
